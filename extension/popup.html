<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verify News</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      width: 380px;
      min-height: 480px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f8fa;
      color: #171717;
    }

    .container {
      padding: 22px;
    }

    .header {
      margin-bottom: 22px;
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      line-height: 1.4;
    }

    .label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 135px;
      resize: vertical;
      border: 1px solid #d8dbe0;
      border-radius: 10px;
      padding: 12px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      background: #ffffff;
      outline: none;
    }

    textarea:focus {
      border-color: #888;
    }

    textarea::placeholder {
      color: #999;
    }

    .verify-button {
      width: 100%;
      margin-top: 14px;
      padding: 12px 16px;
      border: none;
      border-radius: 9px;
      background: #171717;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .verify-button:hover {
      background: #2b2b2b;
    }

    .verify-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      background: #ffffff;
      border: 1px solid #e0e2e5;
      font-size: 13px;
      line-height: 1.5;
    }

    .result {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 10px;
      background: #ffffff;
      border: 1px solid #dfe2e6;
    }

    .result-label {
      font-size: 11px;
      font-weight: 700;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    .verdict {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .confidence {
      font-size: 13px;
      color: #555;
      margin-bottom: 12px;
    }

    .explanation {
      font-size: 13px;
      line-height: 1.5;
      color: #333;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      font-size: 11px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="brand">Verify News</div>
      <div class="subtitle">
        Check news claims against available evidence.
      </div>
    </div>

    <label class="label" for="claim">
      Enter a news claim
    </label>

    <textarea
      id="claim"
      placeholder="Example: The government announced a new national holiday..."
    ></textarea>

    <button
      id="verifyButton"
      class="verify-button"
      type="button"
    >
      Verify Claim
    </button>

    <div id="status" class="status"></div>

    <div id="result" class="result">

      <div class="result-label">
        Verification
      </div>

      <div id="verdict" class="verdict">
        —
      </div>

      <div class="result-label">
        Confidence
      </div>

      <div id="confidence" class="confidence">
        —
      </div>

      <div class="result-label">
        Explanation
      </div>

      <div id="explanation" class="explanation">
        —
      </div>

    </div>

    <div class="footer">
      Verify News · Arthiva Labs
    </div>

  </div>

</body>
</html>
